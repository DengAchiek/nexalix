services:
  - type: web
    name: nexalix-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: ./render_start.sh
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "nexalix-fjjp.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nexalix-fjjp.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexalix-db
          property: connectionString
      - key: SITE_URL
        value: "https://nexalix-fjjp.onrender.com"

databases:
  - name: nexalix-db
    databaseName: nexalix
    user: nexalix
